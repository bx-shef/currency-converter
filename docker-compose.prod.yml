# Продакшн — разместить на сервере в /home/bitrix/currency-converter/
# Требует: docker network proxy-net (создаётся nginx-proxy setup)

services:
  app:
    # Обычно `latest` (авто-обновляет общий Watchtower хоста по метке ниже — свой не поднимаем:
    # он один на все сайты сервера, со входом в ghcr для приватных образов). Для отката задать конкретный
    # immutable-тег: `make prod-rollback TAG=sha-<коммит>` (issue #52 P1).
    image: ghcr.io/bx-shef/currency-converter:${APP_IMAGE_TAG:-latest}
    container_name: currency-converter
    # 8080: the image runs nginx unprivileged (non-root) on 8080.
    expose:
      - "8080"
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${DOMAIN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Cap nginx access logs so json-file doesn't fill the disk over time.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    external: true
