name: CI/CD

# Single pipeline so the deploy is gated on a green CI (issue #45 P1):
#   PR  → ci + docker-build (validate, no registry push)
#   main → ci → deploy (build + push to GHCR; Watchtower picks it up ~5 min)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (issue #52, supply-chain
# hardening): a mutable tag (`@v7`) could be re-pointed at malicious code. The
# trailing `# vX.Y.Z` lets Dependabot (github-actions ecosystem, .github/
# dependabot.yml) bump the SHA and the comment together.
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # 20m: the `nuxt` Vitest project boots a Nuxt runtime on top of lint/typecheck/build/e2e.
    timeout-minutes: 20
    # Real Redis for the second e2e run (the store of connection keys, sessions and nonces in production).
    services:
      redis:
        image: redis:7.4.6-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # Version is read from "packageManager" field in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22 LTS — eslint-flat-config-utils uses Object.groupBy (Node 21+)
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prepare Nuxt
        run: pnpm exec nuxi prepare
        # Generates .nuxt/eslint.config.mjs and .nuxt/tsconfig.json that
        # downstream lint/test/typecheck steps depend on.

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build (nuxt build — Node server)
        run: pnpm build

      # The built server end to end: admin login against a fake Bitrix24, connection key, signed MCP calls,
      # security headers on GET/POST pages (tests/e2e).
      - name: E2E (built server, in-memory store)
        run: pnpm test:e2e

      - name: E2E (built server, Redis)
        run: pnpm test:e2e
        env:
          E2E_REDIS_URL: redis://127.0.0.1:6379

      # Tripwire against re-accumulating vulnerable transitive deps (issue #174:
      # 29 findings had piled up unnoticed, incl. axios shipping to the browser).
      # Gated at `high` on purpose: a newly published low/moderate advisory
      # anywhere in the dev toolchain must not block unrelated PRs. The full
      # `pnpm audit` (all severities) is a periodic manual check — see
      # docs/PROCESS.md §7.1. Fix by adding a floor to pnpm.overrides.
      - name: Audit dependencies (high/critical)
        run: pnpm audit --audit-level high

  docker-build:
    name: docker-build
    # Validate the production image builds on every PR. Catches Dockerfile /
    # base-image breakage (e.g. corepack removed in node 25+, see
    # docs/PROCESS.md §8, грабля #18) before it can reach main and the GHCR
    # deploy. No registry push.
    # Runs on Dependabot PRs too — that is exactly where a node bump would surface.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: currency-converter:ci
          # The analytics counter is irrelevant to a build smoke-test and
          # omitting the secret keeps this job working on Dependabot PRs.
          cache-from: type=gha

      # The image must start as in production (read-only, no capabilities, non-root) and serve /health and a page.
      - name: Smoke-run the image
        run: |
          docker run -d --name cc -p 8080:8080 --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges:true currency-converter:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS -o /dev/null -X POST -d AUTH_ID=x http://127.0.0.1:8080/install
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/widget/converter | grep -qi '^content-security-policy:'
          test "$(docker exec cc id -u)" != "0"
          docker logs cc | tail -20

  deploy:
    name: Build & Push to GHCR
    needs: ci
    # Gate the deploy on CI (issue #45 P1): a red CI now blocks the image from
    # ever reaching GHCR / Watchtower. Only the main branch deploys.
    # DISABLED by the owner (2026-11-24): the app is moving from static nginx to a
    # Node server (#200); nothing may reach the production server until the owner
    # switches the deployment. Re-enable by removing `false &&`.
    if: false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize deploys: two quick pushes to main must not race two GHCR pushes.
    # Don't cancel an in-flight push (a half-pushed image tag is worse than a wait).
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no extra secret needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_YANDEX_COUNTER_ID=${{ secrets.NUXT_PUBLIC_YANDEX_COUNTER_ID }}
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_AUTHOR_NAME=${{ vars.NUXT_PUBLIC_AUTHOR_NAME }}
            NUXT_PUBLIC_AUTHOR_URL=${{ vars.NUXT_PUBLIC_AUTHOR_URL }}
            NUXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
            NUXT_PUBLIC_MARKETPLACE_URL=${{ vars.NUXT_PUBLIC_MARKETPLACE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
