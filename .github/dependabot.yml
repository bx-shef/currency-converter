version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
      b24:
        patterns:
          - "@bitrix24/*"
      dev-deps:
        dependency-type: development
    # TypeScript 7 is the native port: no `typescript/lib/*` in package exports,
    # so vue-tsc crashes with ERR_PACKAGE_PATH_NOT_EXPORTED. Stay on 6.x until
    # vue-tsc supports it; minor/patch of 6.x still flow through.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One grouped PR for all action bumps instead of one PR per action.
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # One grouped PR for all image bumps (today only node; forward-proof if a
    # second base image is ever added).
    groups:
      docker:
        patterns:
          - "*"
    # Node 25+ removed corepack from the official images (`RUN corepack enable`
    # → exit 127). Stay on the 22 LTS line; major bumps are done manually with
    # the corepack fix in place. Minor/patch of node:22-alpine still flow through.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
