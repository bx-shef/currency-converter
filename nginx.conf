server {
    # Port 8080: the image runs as the unprivileged `nginx` user (see Dockerfile),
    # which cannot bind to ports below 1024. The external nginx-proxy maps to it.
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the external nginx-proxy; this server only sees plain
    # http on :8080. With the default `absolute_redirect on`, nginx builds
    # trailing-slash redirects (e.g. /widget/converter → /widget/converter/)
    # from its own scheme+port, emitting `Location: http://host:8080/...`. That
    # leaks the internal port and downgrades to http — inside a Bitrix24 HTTPS
    # iframe it triggers a Mixed-Content block and the widget never loads.
    # Relative redirects let the browser keep the original https://host:443.
    absolute_redirect off;

    # Bitrix24 opens the install/placement handlers with a POST. nginx's static-file
    # handler only allows GET/HEAD and answers POST with `405 Not Allowed`, so the
    # iframe page never renders. The page has no per-request server logic: the
    # b24jssdk frame SDK reads the portal context from `window.name`
    # ("domain|protocol|appSid", see app/composables/useB24.ts) plus a postMessage
    # handshake with the parent — it never reads the POST body. So re-serving the
    # same prerendered HTML on POST is sufficient: remap the static 405 to a 200
    # that re-serves the same $uri.
    error_page 405 =200 $uri;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Nuxt assets — immutable, long cache.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # nginx does NOT inherit server-level add_header once a location sets its
        # own, so repeat the headers that matter for static JS/CSS (issue #46):
        # nosniff (anti-MIME-sniffing) and HSTS. Document-scoped headers (CSP,
        # X-XSS-Protection) are irrelevant to sub-resources and left off.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    # Explicitly disable the legacy XSS auditor (issue #46): the header is obsolete
    # and its filtering has itself caused vulnerabilities, so modern guidance and
    # corporate pentests expect "0". Real XSS protection comes from the CSP below.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), interest-cohort=()" always;
    # No X-Frame-Options here: the app runs as a Bitrix24 iframe app (/install,
    # /widget/converter, and dual-mode /), so framing must be allowed for B24
    # portals. X-Frame-Options can't express an allow-list — CSP frame-ancestors
    # below scopes framing to Bitrix24 cloud domains (self-hosted portals on a
    # custom domain must add their origin there).
    # HSTS: TLS terminates at the external nginx-proxy; force HTTPS for 1y including subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP without `script-src 'unsafe-inline'`: the two inline scripts Nuxt emits in
    # index.html (the FOUC theme-init guard and `window.__NUXT__.config`, whose hash
    # changes per build via buildId) are allow-listed by sha256 hashes injected at
    # build time by scripts/csp-hashes.mjs (replaces the __CSP_SCRIPT_HASHES__ token).
    # Яндекс.Метрика is loaded from a static /metrika.js, so no inline script remains.
    # style-src keeps 'unsafe-inline' — Vue/b24ui emit inline style attributes.
    # Note: if adding location blocks with their own add_header, repeat security headers (nginx does not inherit).
    # frame-ancestors: who may embed us — Bitrix24 portals (cloud TLDs) + self.
    # connect-src: where the app may fetch — api.nbrb.by (rates) + the same B24
    # portal domains (b24jssdk REST calls from the install handler go there).
    # The bitrix24.* TLD list mirrors Bitrix24's cloud zones (issue #88): the
    # international zones come from Bitrix24's "Infrastructure and Sub-processors"
    # doc, plus the CIS zones (.ru/.by/.kz/.ua/.net) it omits (separate hosting).
    # It is best-effort and hand-synced — Bitrix24 adds regions over time, and
    # self-hosted/on-prem portals on a custom domain must add their origin to both
    # directives manually. tests/nginxCsp.test.ts pins the set + frame↔connect parity.
    # frame-ancestors is intentionally NOT narrowed per-location (issue #88, point 2):
    # `/` is dual-mode — it is the B24 Application URL and opens inside the portal
    # iframe, so it needs the same portal allow-list as /install and /widget.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__ mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' mc.yandex.ru data:; connect-src 'self' api.nbrb.by mc.yandex.ru https://*.bitrix24.ru https://*.bitrix24.by https://*.bitrix24.com https://*.bitrix24.net https://*.bitrix24.eu https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.pl https://*.bitrix24.es https://*.bitrix24.com.br https://*.bitrix24.uk https://*.bitrix24.com.tr https://*.bitrix24.mx https://*.bitrix24.co https://*.bitrix24.cn https://*.bitrix24.in https://*.bitrix24.id https://*.bitrix24.jp https://*.bitrix24.vn; font-src 'self'; object-src 'none'; frame-ancestors 'self' https://*.bitrix24.ru https://*.bitrix24.by https://*.bitrix24.com https://*.bitrix24.net https://*.bitrix24.eu https://*.bitrix24.kz https://*.bitrix24.ua https://*.bitrix24.de https://*.bitrix24.fr https://*.bitrix24.it https://*.bitrix24.pl https://*.bitrix24.es https://*.bitrix24.com.br https://*.bitrix24.uk https://*.bitrix24.com.tr https://*.bitrix24.mx https://*.bitrix24.co https://*.bitrix24.cn https://*.bitrix24.in https://*.bitrix24.id https://*.bitrix24.jp https://*.bitrix24.vn; base-uri 'self';" always;
}
